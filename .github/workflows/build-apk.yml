name: Build Dropdesk APK

on:
  push:
    branches: [main, master]
    paths:
      - 'artifacts/social-downloader/**'
      - 'lib/**'
      - 'artifacts/api-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build API server
        run: pnpm --filter api-server build

      - name: Build frontend
        working-directory: artifacts/social-downloader
        env:
          PORT: '5090'
          BASE_PATH: '/'
        run: pnpm vite build

      - name: Sync Capacitor
        working-directory: artifacts/social-downloader
        run: npx cap sync android

      - name: Build APK
        working-directory: artifacts/social-downloader/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dropdesk-debug-apk
          path: artifacts/social-downloader/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Copy APK to root
        run: cp artifacts/social-downloader/android/app/build/outputs/apk/debug/app-debug.apk Dropdesk.apk

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Dropdesk-release-${{ github.sha }}
          path: Dropdesk.apk
          retention-days: 90
