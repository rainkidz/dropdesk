name: Build TubeNime APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon

      # Release signing keys come from GitHub Secrets — never commit the
      # keystore or its passwords to the repo. Until the secrets below are set,
      # the release step is skipped (only the debug artifact is produced).
      #   RELEASE_KEYSTORE_BASE64 : base64 of the keystore file
      #   RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
      - name: Prepare release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android-app/app/release.keystore

      - name: Build Release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: android-app
        env:
          RELEASE_KEYSTORE_FILE: app/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeNime-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: TubeNime-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
