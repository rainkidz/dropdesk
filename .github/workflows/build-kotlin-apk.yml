name: Build TubeNime APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
    # Tag `v*` (mis. v4.4.0) — auto-publish ke GitHub Releases.
    tags: ['v*']

permissions:
  contents: write  # perlu upload release asset

jobs:
  build:
    runs-on: ubuntu-latest

    # Release signing keys + secrets runtime di-mount dari GitHub Secrets.
    # `secrets` tidak bisa dipakai langsung di `if:`, mirror ke env lalu cek
    # string kosong. Bila secret belum diset, langkah release di-skip (tetap
    # menghasilkan debug APK).
    #
    # Secrets yang diharapkan:
    #   RELEASE_KEYSTORE_BASE64   base64 isi keystore
    #   RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
    #   BILLING_BASE_URL          URL publik api-server (opsional)
    #   LICENSE_HMAC_SECRET       secret lisensi (dipakai build untuk HMAC verifikasi)
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      BILLING_BASE_URL: ${{ secrets.BILLING_BASE_URL }}
      LICENSE_HMAC_SECRET: ${{ secrets.LICENSE_HMAC_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android-app/app/release.keystore

      - name: Build Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        working-directory: android-app
        env:
          RELEASE_KEYSTORE_FILE: app/release.keystore
          BILLING_BASE_URL: ${{ env.BILLING_BASE_URL }}
          LICENSE_HMAC_SECRET: ${{ env.LICENSE_HMAC_SECRET }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Release AAB (Play Store upload)
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        working-directory: android-app
        env:
          RELEASE_KEYSTORE_FILE: app/release.keystore
          BILLING_BASE_URL: ${{ env.BILLING_BASE_URL }}
          LICENSE_HMAC_SECRET: ${{ env.LICENSE_HMAC_SECRET }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TubeNime-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: TubeNime-release-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: TubeNime-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab

      # ── Publish ke GitHub Releases saat tag v* dipush. ────────────────
      # Skip bila keystore belum diset (release artifact tidak ada).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASE_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: |
            android-app/app/build/outputs/apk/release/app-release.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
          fail_on_unmatched_files: false
          body: |
            Download `app-release.apk` (sideload) or `app-release.aab` (Play Console).
            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md) for install steps.
